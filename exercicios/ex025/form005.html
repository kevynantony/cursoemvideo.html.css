<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="cadastro.php" method="get" autocomplete="on">

        <fieldset>
            <legend>Sexo</legend>

            <input type="radio" name="sexo" id="isxmas">
            <label for="isxmas">Masculino</label>

            <p>
                <input type="radio" name="sexo" id="isxfem">
                <label for="isxfem">Feminino</label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Esportes favoritos</legend>
            
            <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futebol</label>

            <p><input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">Basquete</label> </p>

            <p><input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Natação</label></p>

            <p><input type="checkbox" name="estdm" id="iestdm"> <label for="iestdm">Tênis de Mesa</label></p>


        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>




    </form>
    
</body>
</html>
