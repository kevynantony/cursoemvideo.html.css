<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;    
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        thead, tfoot {
            background-color: silver;
        }

        td.num {
            text-align: right;
        }

        tbody > tr:nth-child(2n) {
            background-color: rosybrown;

        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: gold;
        }


    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <table>

        <caption>População das Unidades Federativas</caption>

        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col" style="width: 100px;">População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">45.919.049</td>
            </tr>

            <tr>
                <td>Minas Gerais</td>
                <td class="num">21.168.791</td>
            </tr>

            <tr>
                <td>Rio de janeiro</td>
                <td class="num">17.264.943</td>
            </tr>

            <tr>
                <td>Bahia</td>
                <td class="num">14.870.907</td>
            </tr>

            <tr>
                <td>Rio Grande do Sul</td>
                <td class="num">1.123.3263</td>
            </tr>

            <tr>
                <td>Pernambuco</td>
                <td class="num">9.562.007</td>
            </tr>

            <tr>
                <td>Ceará</td>
                <td class="num">9.268.836</td>
            </tr>

            <tr>
                <td>Pará</td>
                <td class="num">8.711.196</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th scope="row">Total de Habitantes</th>
                <td style="text-align: right;">0000</td>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
